services:
  # =========================
  # BACKEND
  # =========================
  - type: web
    name: cses-backend
    runtime: node
    rootDir: backend

    buildCommand: npm install
    startCommand: npm start

    envVars:
      - key: NODE_ENV
        value: production

      - key: MONGO_URI
        sync: false

      - key: REDIS_URL
        sync: false

      - key: JWT_SECRET
        sync: false


  # =========================
  # FRONTEND
  # =========================
  - type: static
    name: cses-frontend
    rootDir: frontend

    buildCommand: npm install && npm run build
    staticPublishPath: ./dist


  # =========================
  # REDIS / BULLMQ
  # =========================
  - type: keyvalue
    name: cses-redis
    plan: free
    ipAllowList: []
